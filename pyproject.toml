[project]
name = "tec1053"
version = "0.1.0"
description = "Repositório-base da disciplina TEC.1053 — Tópicos Especiais em Programação, IFPI"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
# Um laboratório por linha. Ao criar um novo lab, acrescente o src dele aqui.
pythonpath = ["labs/lab-01-validador-senha/src"]
testpaths = ["labs"]
addopts = "-v"

[tool.ruff]
line-length = 88
# Mesma lista do pythonpath acima: é assim que o ruff sabe distinguir import
# do próprio laboratório de import de biblioteca externa.
src = ["labs/lab-01-validador-senha/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
